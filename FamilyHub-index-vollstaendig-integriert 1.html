<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FamilyHub</title>
<style>
:root{--b:#1f4e79;--bg:#eef6ff;--card:#fff;--line:#d8e5ef;--muted:#607080;--green:#2d7d56}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,system-ui,-apple-system,sans-serif;color:#172033}header{background:var(--b);color:#fff;padding:18px}header h1{margin:0}.wrap{max-width:1200px;margin:auto;padding:14px}.panel{background:#fff;padding:14px;border-radius:18px;margin-bottom:14px;box-shadow:0 3px 12px #1231}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:14px}.tabs button,.actions button,button{border:0;border-radius:10px;padding:9px 11px;background:var(--b);color:#fff;font-weight:700;cursor:pointer}.tabs button.on{background:var(--green)}.tab{display:none}.tab.on{display:block}.days{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.day{border:1px solid var(--line);border-radius:15px;padding:11px;background:#fbfdff}.day h3{margin:0 0 8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}select,input{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:10px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{background:#e7f0f7;color:#173b5d;border:1px solid #cadde9;padding:7px 9px;border-radius:999px}.chip.on{background:var(--green);color:#fff}.meal{margin-top:9px;background:#edf8f1;border:1px solid #bddfc9;border-radius:10px;padding:9px;font-weight:800}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekCard{min-height:145px;border-radius:14px;padding:9px;background:#fff;border:2px solid #d8e5ef}.weekCard h3{margin:0;color:var(--b)}.weekMeal{margin-top:20px;font-weight:800}.masterType{border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}.masterType>summary{padding:10px;background:#eaf3fb;font-weight:800;cursor:pointer}.masterGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;padding:7px}.entry{border:1px solid var(--line);border-radius:10px;padding:8px}.entry small{display:block;color:var(--muted)}.recipeGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.recipeCard{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff}.recipeCard img{width:100%;height:150px;object-fit:cover;background:#dfeaf2}.recipeBody{padding:11px}.recipeBody h3{margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.on{display:flex}.dialog{background:#fff;border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow:auto}.dialog img{width:100%;max-height:300px;object-fit:cover;background:#dfeaf2}.dialogBody{padding:16px}.close{float:right}.status{padding:9px;border-radius:10px;background:#fff4d5;margin-bottom:10px}.error{background:#ffe3e3}@media(max-width:800px){.days,.grid2,.week{grid-template-columns:1fr}.weekCard{min-height:auto}}
.event{display:grid;grid-template-columns:105px 1fr 85px 32px;gap:5px;margin:5px 0}.events{background:#f7fbfe;padding:7px;border-radius:10px;margin:7px 0}.toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.toolbar label{min-width:180px}.shopping textarea{width:100%;min-height:110px}.hidden{display:none!important}@media(max-width:800px){.event{grid-template-columns:1fr}.week{grid-template-columns:1fr}}@media print{header,.tabs,#plan,#components,#recipes,#shopping,.noPrint{display:none!important}#fridge{display:block!important}.week{grid-template-columns:repeat(7,1fr)!important}.weekCard{min-height:230px}body{background:#fff}}
</style></head><body>
<header><h1>🏠 FamilyHub</h1><div>Menüplanung mit ComponentMaster und RecipeMaster</div></header><main class="wrap">
<div id="status" class="status">Masterdaten werden geladen …</div>
<nav class="tabs"><button data-tab="plan" class="on">📅 Planen</button><button data-tab="fridge">🧊 Kühlschrank</button><button data-tab="components">🧩 Komponenten</button><button data-tab="recipes">📖 Rezepte</button><button data-tab="shopping">🛒 Einkauf</button></nav>
<section id="plan" class="tab on"><div class="panel toolbar"><label>Planstart Montag<input id="startDate" type="date"></label><div class="actions"><button id="random">🎲 Vorschlag</button><button id="printBtn">🖨 Kühlschrank drucken</button><button id="save">💾 Plan speichern</button><button id="loadBtn">📂 Plan laden</button><input id="loadFile" type="file" accept=".json" hidden></div></div><div id="days" class="days"></div></section>
<section id="fridge" class="tab"><div class="panel"><div class="printHead"><h2 id="weekTitle">Wochenplan</h2><div id="weekDates" class="muted"></div></div><div id="weekGrid" class="week weekGrid"></div></div></section>
<section id="components" class="tab"><div class="panel"><h2>Komponenten</h2><input id="componentSearch" placeholder="Komponenten suchen"><div id="componentList"></div></div></section>
<section id="recipes" class="tab"><div class="panel"><h2>Rezepte</h2><div id="recipeGrid" class="recipeGrid"></div></div></section>
<section id="shopping" class="tab"><div class="panel shopping"><h2>🛒 Einkauf / Bring!</h2><textarea id="bring" placeholder="Vorhandene Artikel oder Bring!-Liste einfügen"></textarea><div class="actions"><button id="analyze">Analysieren</button><button id="copyMissing">Fehlende kopieren</button></div><h3>Fehlt noch</h3><ul id="missing"></ul></div></section></main><div id="modal" class="modal"><article class="dialog"><img id="modalImg" alt=""><div class="dialogBody"><button id="close" class="close">×</button><h2 id="modalTitle"></h2><p id="modalMeta" class="muted"></p><h3>🥕 Zutaten</h3><ul id="modalIngredients"></ul><h3>👨‍🍳 Zubereitung</h3><ol id="modalSteps"></ol><div class="actions"><button id="sourceBtn">🌐 Originalrezept</button></div></div></article></div>
<script>
const COMPONENT_URL='data/FamilyHub_ComponentMaster.json',RECIPE_URL='data/FamilyHub_RecipeMaster.json';
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const TYPES={'Musik':'🎵','Fitness':'🏋️','Arzt':'🏥','Besuch':'👥','Einkauf':'🛒','Geburtstag':'🎂','Ferien':'✈️','Auswärts':'🚗','Familie':'👨‍👩‍👧','Telefon':'📞','Unternehmung':'🌟','Sonstiges':'📅'};
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cm={components:[],preparationOptions:[]},rm={recipes:[]},plan=[];
const emptyDay=()=>({events:[],main:'',sides:[],extras:[],dish:'',prep:[]});
function normalizePlan(x){let a=Array.isArray(x)?x:Object.keys(x||{}).sort((a,b)=>+a-+b).map(k=>x[k]);return Array.from({length:14},(_,i)=>({...emptyDay(),...(a[i]||{}),events:a[i]?.events||[],sides:a[i]?.sides||[],extras:a[i]?.extras||[],prep:a[i]?.prep||[]}))}
function getStart(){let x=localStorage.getItem('fh_start_v9');if(x)return x;let d=new Date(),n=d.getDay();d.setDate(d.getDate()-((n+6)%7));return d.toISOString().slice(0,10)}
function dateAt(i){let d=new Date($('startDate').value+'T12:00:00');d.setDate(d.getDate()+i);return d}function fmt(d){return d.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'})}function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));let y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-y)/86400000)+1)/7)}
async function boot(){plan=normalizePlan(JSON.parse(localStorage.getItem('fh_plan_v9')||'null'));$('startDate').value=getStart();bind();try{let[a,b]=await Promise.all([fetch(COMPONENT_URL,{cache:'no-store'}),fetch(RECIPE_URL,{cache:'no-store'})]);if(!a.ok||!b.ok)throw Error();cm=await a.json();rm=await b.json();$('status').style.display='none';render()}catch{$('status').classList.add('error');$('status').innerHTML='Masterdaten fehlen. Erwartet: <b>'+COMPONENT_URL+'</b> und <b>'+RECIPE_URL+'</b>.';render()}}
const comps=role=>cm.components.filter(c=>(c.usage||[c.type]).includes(role)),byId=id=>cm.components.find(c=>c.id===id),recipe=id=>rm.recipes.find(r=>r.id===id);
function options(role,sel){return'<option value="">– wählen –</option>'+comps(role).map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
function mealName(p){if(p.dish)return byId(p.dish)?.name||'';let a=[byId(p.main)?.name,...p.sides.map(x=>byId(x)?.name),...p.extras.map(x=>byId(x)?.name)].filter(Boolean);return(a[0]||'')+(a.length>1?' mit '+a.slice(1).join(' und '):'')+(p.prep.length?' · '+p.prep.join(', '):'')}
function saveState(){localStorage.setItem('fh_plan_v9',JSON.stringify(plan));localStorage.setItem('fh_start_v9',$('startDate').value)}function render(){renderCards();renderFridge();renderComponents();renderRecipes();renderShopping();saveState()}
function renderCards(){$('days').innerHTML=DAYS.map((d,i)=>{let p=plan[i],rec=recipeForPlan(p);return`<article class="day"><h3>${d}</h3><div class="muted">${fmt(dateAt(i))}</div><div class="events" id="ev${i}"></div><button data-add="${i}">+ Termin</button><div class="grid2"><label>🍗 Hauptspeise<select data-main="${i}">${options('Hauptspeise',p.main)}</select></label><label>🍲 Gericht<select data-dish="${i}">${options('Gericht',p.dish)}</select></label></div><b>🥗 Beilagen</b><div class="chips">${comps('Beilage').map(c=>`<button class="chip ${p.sides.includes(c.id)?'on':''}" data-side="${i}:${c.id}">${esc(c.name)}</button>`).join('')}</div><b>✨ Extras</b><div class="chips">${comps('Extra').map(c=>`<button class="chip ${p.extras.includes(c.id)?'on':''}" data-extra="${i}:${c.id}">${esc(c.name)}</button>`).join('')}</div><b>🔥 Zubereitung</b><div class="chips">${(cm.preparationOptions||[]).map(x=>`<button class="chip ${p.prep.includes(x)?'on':''}" data-prep="${i}:${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="meal">${esc(mealName(p)||'Noch kein Menü gewählt')}</div>${rec?`<button data-recipe="${rec.id}" style="margin-top:7px">📖 Rezept</button>`:''}</article>`}).join('');DAYS.forEach((_,i)=>renderEvents(i));document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{plan[+x.dataset.add].events.push({type:'Sonstiges',title:'',time:''});render()});document.querySelectorAll('[data-main]').forEach(x=>x.onchange=e=>{let p=plan[+x.dataset.main];p.main=e.target.value;if(p.main)p.dish='';render()});document.querySelectorAll('[data-dish]').forEach(x=>x.onchange=e=>{let p=plan[+x.dataset.dish];p.dish=e.target.value;if(p.dish){p.main='';p.sides=[];p.extras=[]}render()});toggleBtns('side','sides');toggleBtns('extra','extras');document.querySelectorAll('[data-prep]').forEach(x=>x.onclick=()=>{let[i,...z]=x.dataset.prep.split(':');toggle(+i,'prep',z.join(':'))});document.querySelectorAll('#days [data-recipe]').forEach(x=>x.onclick=()=>showRecipe(x.dataset.recipe))}
function renderEvents(i){let box=$('ev'+i);box.innerHTML='';plan[i].events.forEach((e,j)=>{let r=document.createElement('div');r.className='event';r.innerHTML=`<select>${Object.keys(TYPES).map(t=>`<option ${e.type===t?'selected':''}>${t}</option>`).join('')}</select><input value="${esc(e.title)}" placeholder="Beschreibung"><input value="${esc(e.time)}" placeholder="Zeit"><button>×</button>`;let[t,n,tm,del]=r.children;t.oninput=n.oninput=tm.oninput=()=>{plan[i].events[j]={type:t.value,title:n.value,time:tm.value};saveState();renderFridge()};del.onclick=()=>{plan[i].events.splice(j,1);render()};box.appendChild(r)})}
function toggleBtns(a,key){document.querySelectorAll(`[data-${a}]`).forEach(x=>x.onclick=()=>{let[i,id]=x.dataset[a].split(':');toggle(+i,key,id)})}function toggle(i,key,id){let a=plan[i][key];plan[i][key]=a.includes(id)?a.filter(x=>x!==id):[...a,id];render()}
function recipeForPlan(p){let c=p.dish?byId(p.dish):byId(p.main);return c?.recipeId?recipe(c.recipeId):null}
function renderFridge(){let s=dateAt(0),e=dateAt(13);$('weekTitle').textContent=`Wochenplan KW ${isoWeek(s)} / ${isoWeek(dateAt(7))}`;$('weekDates').textContent=`${fmt(s)} - ${fmt(e)}`;$('weekGrid').innerHTML=DAYS.map((d,i)=>{let ev=(plan[i].events||[]).slice(0,4).map(x=>`<div class="weekEvent">${TYPES[x.type]||'📅'} ${esc([x.title,x.time].filter(Boolean).join(' '))}</div>`).join('');return`<article class="weekCard"><h3>${d}<br><small>${fmt(dateAt(i))}</small></h3><div class="weekEvents">${ev||'&nbsp;'}</div><div class="weekMeal">${mealName(plan[i])?'🍽 '+esc(mealName(plan[i])):'&nbsp;'}</div></article>`}).join('')}
function renderComponents(){let q=($('componentSearch').value||'').toLowerCase(),g={};cm.components.filter(c=>[c.name,c.type,c.category].join(' ').toLowerCase().includes(q)).forEach(c=>(g[c.type]||(g[c.type]=[])).push(c));$('componentList').innerHTML=Object.entries(g).map(([t,a])=>`<details class="masterType" open><summary>${esc(t)} (${a.length})</summary><div class="masterGrid">${a.sort((x,y)=>x.name.localeCompare(y.name,'de')).map(c=>`<div class="entry"><b>${esc(c.name)}</b><small>${esc(c.category)}</small><small>${esc((c.usage||[]).join(' + '))}</small>${c.recipeId?`<button data-recipe="${c.recipeId}">📖 Rezept</button>`:''}</div>`).join('')}</div></details>`).join('');document.querySelectorAll('#componentList [data-recipe]').forEach(x=>x.onclick=()=>showRecipe(x.dataset.recipe))}
function renderRecipes(){$('recipeGrid').innerHTML=rm.recipes.map(r=>`<article class="recipeCard"><img src="${esc(r.image?.path||'')}" alt="${esc(r.image?.alt||r.name)}" onerror="this.style.display='none'"><div class="recipeBody"><h3>${esc(r.name)}</h3><div class="muted">${r.servings||'–'} Personen · ${r.prepMinutes||0} Min. Vorbereitung · ${r.ovenMinutes||0} Min. Ofen</div><button data-recipe="${r.id}">📖 Anzeigen</button></div></article>`).join('');document.querySelectorAll('#recipeGrid [data-recipe]').forEach(x=>x.onclick=()=>showRecipe(x.dataset.recipe))}
function showRecipe(id){let r=recipe(id);if(!r)return;$('modalTitle').textContent=r.name;$('modalMeta').textContent=`${r.servings||'–'} Personen · ${r.prepMinutes||0} Min. Vorbereitung · ${r.ovenMinutes||0} Min. Ofen`;$('modalImg').src=r.image?.path||'';$('modalIngredients').innerHTML=(r.ingredients||[]).map(x=>`<li>${esc([x.amount,x.unit,x.name].filter(v=>v!==''&&v!=null).join(' '))}</li>`).join('');$('modalSteps').innerHTML=(r.stepsSummary||[]).map(x=>`<li>${esc(x)}</li>`).join('');$('sourceBtn').onclick=()=>window.open(r.source?.url,'_blank','noopener');$('modal').classList.add('on')}
function needed(){let a=[];plan.forEach(p=>{let r=recipeForPlan(p);if(r)(r.ingredients||[]).forEach(x=>a.push(x.name));else[p.main,...p.sides,...p.extras].filter(Boolean).forEach(id=>{let c=byId(id);(c?.ingredients||[]).forEach(x=>a.push(x))})});return[...new Set(a)].sort((a,b)=>a.localeCompare(b,'de'))}function renderShopping(){let have=$('bring').value.split(/\n|,|;/).map(x=>x.trim().toLowerCase()).filter(Boolean);$('missing').innerHTML=needed().filter(x=>!have.includes(x.toLowerCase())).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Alles vorhanden</li>'}async function copyMissing(){renderShopping();let t=[...$('missing').querySelectorAll('li')].map(x=>x.textContent).join('\n');try{await navigator.clipboard.writeText(t);alert('Kopiert')}catch{prompt('Kopieren',t)}}
function bind(){document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.tab).classList.add('on');render()});$('startDate').onchange=()=>{saveState();render()};$('componentSearch').oninput=renderComponents;$('close').onclick=()=>$('modal').classList.remove('on');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('on')};$('random').onclick=()=>{let m=comps('Hauptspeise'),s=comps('Beilage');plan.forEach(p=>{p.dish='';p.main=m[Math.floor(Math.random()*m.length)]?.id||'';p.sides=s.length?[s[Math.floor(Math.random()*s.length)].id]:[];p.extras=[]});render()};$('printBtn').onclick=()=>{document.querySelector('[data-tab="fridge"]').click();setTimeout(()=>print(),80)};$('save').onclick=()=>download('FamilyHub_Plan.json',{format:'FamilyHubPlan',version:9,start:$('startDate').value,plan});$('loadBtn').onclick=()=>$('loadFile').click();$('loadFile').onchange=e=>{let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);plan=normalizePlan(x.plan);if(x.start)$('startDate').value=x.start;render()}catch{alert('Ungültige Plandatei')}};r.readAsText(f)};$('analyze').onclick=renderShopping;$('copyMissing').onclick=copyMissing}
function download(n,o){let u=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}boot();
</script><script src="handy-export.js"></script></body></html>
