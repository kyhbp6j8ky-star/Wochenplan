<!doctype html>
<html lang="de">

<head>
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FamilyHub V1.1</title>
    <style>
        :root {
            --n: #1f4e79;
            --b: #eef6ff;
            --g: #e2f0d9;
            --m: #64748b;
            --s: 0 16px 38px #0f172a16
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Segoe UI, system-ui, sans-serif;
            background: linear-gradient(#eaf4ff, #fbfdff);
            color: #172033
        }

        header {
            background: var(--n);
            color: #fff;
            padding: 20px 24px;
            border-radius: 0 0 26px 26px
        }

        header h1 {
            margin: 3px 0
        }

        .ver {
            background: #ffffff26;
            padding: 5px 9px;
            border-radius: 99px;
            font-weight: 800;
            font-size: 12px
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
            padding: 10px;
            position: sticky;
            top: 0;
            background: #f8fbffee;
            backdrop-filter: blur(8px);
            z-index: 3
        }

        button {
            border: 0;
            border-radius: 14px;
            padding: 11px;
            background: #eaf2fb;
            color: var(--n);
            font-weight: 800;
            cursor: pointer
        }

        .primary,
        .tabs .active {
            background: var(--n);
            color: #fff
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 10px
        }

        .tab {
            display: none
        }

        .tab.active {
            display: block
        }

        .toolbar,
        .panel,
        .card {
            background: #fff;
            border: 1px solid #dbe7f4;
            border-radius: 20px;
            box-shadow: var(--s);
            padding: 14px
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: end;
            flex-wrap: wrap;
            margin-bottom: 12px
        }

        .toolbar label {
            min-width: 180px
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px
        }

        .card h2 {
            margin: 0;
            color: var(--n)
        }

        .date {
            color: var(--m);
            font-size: 13px
        }

        .events {
            background: #f8fbff;
            padding: 9px;
            border-radius: 14px;
            margin: 10px 0
        }

        .event {
            display: grid;
            grid-template-columns: 100px 1fr 90px 34px;
            gap: 6px;
            margin: 5px 0
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            font: inherit
        }

        .selected {
            background: linear-gradient(135deg, #eaf5ff, #fff);
            padding: 12px;
            border-radius: 15px;
            border: 1px solid #d6e7f8
        }

        .searchResults {
            max-height: 190px;
            overflow: auto;
            display: grid;
            gap: 5px;
            margin-top: 6px
        }

        .hit {
            padding: 8px;
            border: 1px solid #d6e7f8;
            border-radius: 10px;
            cursor: pointer
        }

        .hit:hover {
            background: var(--g)
        }

        .weekGrid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 10px
        }

        .weekCard {
            border: 2px solid #d6e7f8;
            border-radius: 14px;
            padding: 9px;
            min-height: 170px;
            display: flex;
            flex-direction: column
        }

        .weekEvents {
            height: 80px;
            overflow: hidden;
            margin-bottom: 8px
        }

        .weekEvent {
            font-size: 14px;
            line-height: 1.25;
            margin: 3px 0
        }

        .weekCard:nth-child(7n+1) {
            background: #b7e4c7
        }

        .weekCard:nth-child(7n+1){background:#95d5a4}
.weekCard:nth-child(7n+2){background:#ffd54f}
.weekCard:nth-child(7n+3){background:#7cc5f7}
.weekCard:nth-child(7n+4){background:#b69cff}
.weekCard:nth-child(7n+5){background:#ff8f8f}
.weekCard:nth-child(7n+6){background:#ffb56b}
.weekCard:nth-child(7n+7){background:#7ddfd0}

        .weekCard {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact
        }

        .weekEvents,
        .weekMeal {
            background: rgba(255, 255, 255, .88);
            border-radius: 8px;
            padding: 7px
        }

        .weekMeal {
            border-top: 1px solid rgba(31, 78, 121, .20)
        }

        .weekCard h3 {
            color: var(--n);
            margin: 0 0 8px
        }

        .weekMeal {
            border-top: 1px solid #d6e7f8;
            margin-top: auto;
            padding-top: 9px;
            min-height: 64px;
            font-weight: 800
        }

        .masterbar {
            display: grid;
            grid-template-columns: 2fr 1fr auto auto;
            gap: 8px
        }

        .masterList {
            display: grid;
            gap: 8px;
            margin-top: 12px
        }

        .masterItem {
            border: 1px solid #dbe7f4;
            border-radius: 14px;
            padding: 11px
        }

        .masterItem.off {
            opacity: .5
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap
        }

        .formgrid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 8px
        }

        .formgrid textarea {
            grid-column: 1/-1
        }

        .hidden {
            display: none !important
        }

        @media(max-width:1000px) {
            .cards {
                grid-template-columns: 1fr
            }

            .weekGrid {
                grid-template-columns: 1fr
            }

            .event,
            .masterbar,
            .formgrid {
                grid-template-columns: 1fr
            }

            .tabs {
                font-size: 12px
            }
        }

        @media print {
            @page {
                size: A4 landscape;
                margin: 10mm
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important
            }

            html,
            body {
                width: 100% !important;
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
                overflow: hidden !important
            }

            header,
            .tabs,
            #plan,
            #master,
            #shopping,
            .noPrint {
                display: none !important
            }

            main {
                display: block !important;
                width: 100% !important;
                height: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important
            }

            #fridge {
                display: block !important;
                width: 100% !important;
                height: 100% !important
            }

            #fridge .panel {
                display: flex !important;
                flex-direction: column !important;
                width: 100% !important;
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                border: 0 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                overflow: hidden !important
            }

            .printHead {
                flex: 0 0 10mm !important;
                text-align: center !important;
                margin: 0 0 2mm !important;
                padding: 0 !important;
                line-height: 1.05 !important
            }

            .printHead h1 {
                display: none !important
            }

            .printHead h2 {
                font-size: 18pt !important;
                margin: 0 !important
            }

            .printHead p {
                display: none !important
            }

            .weekGrid {
                flex: 1 1 auto !important;
                display: grid !important;
                grid-template-columns: repeat(7, minmax(0, 1fr)) !important;
                grid-template-rows: repeat(2, minmax(0, 1fr)) !important;
                gap: 2mm !important;
                width: auto !important;
                height: auto !important;
                min-height: 0 !important;
                overflow: hidden !important
            }

            .weekCard {
                border: 2px solid gray !important;
                border-radius: 3mm !important;
                
                display: flex !important;
                flex-direction: column !important;
                
                overflow: hidden !important
            }

            .weekCard h3 {
                flex: 0 0 auto !important;
                font-size: 12pt !important;
                line-height: 1.1 !important;
                margin: 0 0 1.5mm !important;
                text-align: center !important;
                transform: translateY(-1mm)
            }

            .weekCard h3 small {
                font-size: 12pt !important
            }

            .weekEvents {
                flex: 1 1 auto !important;
                max-height: 35mm !important;
                min-height: 3mm !important;
                margin: 0 0 1mm !important;
                padding: 1.2mm !important;
                overflow: hidden !important;
                border-radius: 1.5mm !important
            }

            .weekEvent {
                font-size: 12pt !important;
                line-height: 1.25 !important;
                margin: 0 0 1mm !important;
                overflow-wrap: anywhere !important
            }

            .weekEvent .eventType {
                display: none !important
            }

            .weekMeal {
               max-height: 35mm !important;
                min-height: 3mm !important;
                margin-top: auto !important;
                font-size: 12pt !important;
                
                font-weight: 600 !important;
               
            }
        }
    </style>
</head>

<body>
    <header><span class="ver">V1 Consolidated</span>
        <h1>FamilyHub</h1>
        <div>Montag bis Montag · Menü-Master · Kühlschrankplan</div>
    </header>
    <nav class="tabs"><button data-tab="plan" class="active">Plan</button><button
            data-tab="fridge">Kühlschrank</button><button data-tab="master">Menü-Master</button><button
            data-tab="shopping">Einkauf</button></nav>
    <main>
        <section id="workspacePanel" class="panel" style="margin-bottom:12px"><div class="toolbar"><button id="chooseWorkspace" type="button" class="primary">📁 FamilyHub-Ordner verbinden</button><button id="loadWorkspace" type="button">↻ Daten aus Ordner laden</button><span id="workspaceStatus" class="small">Kein Arbeitsordner verbunden</span></div></section>
        <section id="plan" class="tab active">
            <div class="toolbar"><label>Planstart Montag<input id="startDate" type="date"></label><button id="go"
                    class="primary">GO</button><button id="printBtn">Kühlschrank drucken</button><button
                    id="exportPlan">Plan sichern</button><button id="importPlanBtn">Plan laden</button><input
                    id="importPlan" class="hidden" type="file" accept="application/json"></div>
            <div id="cards" class="cards"></div>
        </section>
        <section id="fridge" class="tab">
            <div class="panel">
                <div class="printHead">
                    <h1>FamilyHub</h1>
                    <h2 id="weekTitle"></h2>
                    <p id="weekDates"></p>
                </div>
                <div id="weekGrid" class="weekGrid"></div>
            </div>
        </section>
        <section id="master" class="tab">
            <div class="panel">
                <h2>Master-Menüliste</h2>
                <div class="masterbar"><input id="masterSearch" placeholder="Menü, Kategorie oder Zutat suchen"><select
                        id="masterFilter">
                        <option value="">Alle Kategorien</option>
                        <option>Schnell</option>
                        <option>Fisch</option>
                        <option>Poulet/Fleisch</option>
                        <option>Vegetarisch/Ei</option>
                        <option>Beilage</option>
                    </select><button id="exportMaster">Export</button><button id="importMasterBtn">Import</button><input
                        id="importMaster" class="hidden" type="file" accept="application/json"></div>
                <div id="editForm" class="formgrid" style="margin-top:12px"><input id="fName"
                        placeholder="Menüname"><input id="fMinutes" type="number" placeholder="Minuten"><select
                        id="fCategory">
                        <option>Schnell</option>
                        <option>Fisch</option>
                        <option>Poulet/Fleisch</option>
                        <option>Vegetarisch/Ei</option>
                        <option>Beilage</option>
                        <option>Resten/Flexibel</option>
                    </select><textarea id="fIngredients" placeholder="Zutaten, je Zeile eine"></textarea><select
                        id="fMode">
                        <option>Schnell</option>
                        <option>Prep</option>
                        <option>Leicht/Protein</option>
                        <option>Flexibel</option>
                        <option>Offen</option>
                        <option>Puffer</option>
                    </select><button id="saveMenu" class="primary">Neu speichern</button><button
                        id="cancelEdit">Abbrechen</button></div>
                <div id="masterList" class="masterList"></div>
            </div>
        </section>
        <section id="shopping" class="tab">
            <div class="panel">
                <h2>🛒 Einkauf / Bring!</h2><textarea id="bring" placeholder="Bring!-Liste einfügen"></textarea><button
                    id="analyze">Analysieren</button><button id="copyMissing">Fehlende kopieren</button>
                <h3>Fehlt noch</h3>
                <ul id="missing"></ul>
            </div>
        </section>
    </main>
    <script>
        const DAYS = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag']; const TYPES = { 'Musik': '🎵', 'Fitness': '🏋️', 'Arzt': '🏥', 'Besuch': '👥', 'Einkauf': '🛒', 'Geburtstag': '🎂', 'Ferien': '✈️', 'Auswärts': '🚗', 'Familie': '👨‍👩‍👧', 'Telefon': '📞', 'Unternehmung': '🌟', 'Sonstiges': '📅' }; let master = [], plan = {}, editingId = null; const $ = id => document.getElementById(id), get = (k, d) => JSON.parse(localStorage.getItem(k) || JSON.stringify(d)), set = (k, v) => localStorage.setItem(k, JSON.stringify(v));
        async function init() { master = get('fh84_master', []); plan = get('fh84_plan', {}); $('startDate').value = getStart(); bind(); ensurePlan(); renderAll() }
        function getStart() { let s = localStorage.getItem('fh84_start'); if (s) return s; let d = new Date(), day = d.getDay(); if (day === 0) d.setDate(d.getDate() + 1); else d.setDate(d.getDate() - ((day + 6) % 7)); return d.toISOString().slice(0, 10) } function dateAt(i) { let d = new Date($('startDate').value + 'T12:00:00'); d.setDate(d.getDate() + i); return d } function fmt(d) { return d.toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric' }) } function isoWeek(d) { d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7)); let y = new Date(Date.UTC(d.getUTCFullYear(), 0, 1)); return Math.ceil((((d - y) / 86400000) + 1) / 7) } function mode(i) { return ['Puffer', 'Prep', 'Schnell', 'Leicht/Protein', 'Flexibel', 'Offen', 'Normal/Prep'][i % 7] }
        function ensurePlan() { DAYS.forEach((_, i) => { plan[i] = plan[i] || { events: [], menuId: null } }); savePlan() } function savePlan() { set('fh84_plan', plan); localStorage.setItem('fh84_start', $('startDate').value) }
        function bind() { document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { document.querySelectorAll('.tabs button,.tab').forEach(x => x.classList.remove('active')); b.classList.add('active'); $(b.dataset.tab).classList.add('active'); renderAll() }); $('startDate').onchange = () => { plan = {}; DAYS.forEach((_, i) => plan[i] = { events: [], menuId: null }); savePlan(); renderAll() }; $('go').onclick = () => { DAYS.forEach((_, i) => { let p = master.filter(m => m.active !== false && (m.modes || []).includes(mode(i))); if (!p.length) p = master.filter(m => m.active !== false); plan[i].menuId = p[Math.floor(Math.random() * p.length)]?.id || null }); savePlan(); renderAll() }; $('printBtn').onclick = () => { document.querySelector('[data-tab="fridge"]').click(); setTimeout(() => window.print(), 80) }; $('masterSearch').oninput = renderMaster; $('masterFilter').onchange = renderMaster; $('saveMenu').onclick = saveMenu; $('cancelEdit').onclick = clearForm; $('exportMaster').onclick = () => download('FamilyHub_MenuMaster.json', master); $('importMasterBtn').onclick = () => $('importMaster').click(); $('importMaster').onchange = e => readJson(e, arr => { master = arr; set('fh84_master', master); renderAll() }); $('exportPlan').onclick = () => download('FamilyHub_Plan.json', { start: $('startDate').value, plan }); $('importPlanBtn').onclick = () => $('importPlan').click(); $('importPlan').onchange = e => readJson(e, o => { $('startDate').value = o.start; plan = o.plan; savePlan(); renderAll() }); $('analyze').onclick = renderShopping; $('copyMissing').onclick = copyMissing }
        function renderAll() { renderCards(); renderFridge(); renderMaster(); renderShopping() }
        function menuById(id) { return master.find(m => m.id === id) } function renderCards() { let c = $('cards'); c.innerHTML = ''; DAYS.forEach((day, i) => { let card = document.createElement('article'); card.className = 'card'; let m = menuById(plan[i].menuId); card.innerHTML = `<h2>${day}</h2><div class="date">${fmt(dateAt(i))} · ${mode(i)}</div><div class="events" id="ev${i}"></div><button data-add="${i}">+ Termin</button><div class="selected"><b>${m ? '🍽 ' + m.name : 'Noch kein Menü gewählt'}</b><div>${m ? m.minutes + ' Min. · ' + m.ingredients.join(', ') : ''}</div></div><label>Menü suchen<input data-search="${i}" placeholder="Name, Zutat, Kategorie"></label><div id="sr${i}" class="searchResults"></div>`; c.appendChild(card); renderEvents(i); card.querySelector('[data-add]').onclick = () => { plan[i].events.push({ type: 'Sonstiges', title: '', time: '' }); savePlan(); renderCards(); renderFridge() }; card.querySelector('[data-search]').oninput = e => renderSearch(i, e.target.value) }) }
        function renderEvents(i) { let box = $('ev' + i); box.innerHTML = ''; plan[i].events.forEach((e, j) => { let row = document.createElement('div'); row.className = 'event'; row.innerHTML = `<select>${Object.keys(TYPES).map(t => `<option ${e.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select><input value="${e.title || ''}" placeholder="Beschreibung"><input value="${e.time || ''}" placeholder="Zeit"><button>×</button>`; let [t, ti, tm, del] = row.children; t.oninput = ti.oninput = tm.oninput = () => { plan[i].events[j] = { type: t.value, title: ti.value, time: tm.value }; savePlan(); renderFridge() }; del.onclick = () => { plan[i].events.splice(j, 1); savePlan(); renderCards(); renderFridge() }; box.appendChild(row) }) }
        function renderSearch(i, q) { let b = $('sr' + i); b.innerHTML = ''; q = q.trim().toLowerCase(); if (!q) return; master.filter(m => m.active !== false && `${m.name} ${m.categories.join(' ')} ${m.ingredients.join(' ')}`.toLowerCase().includes(q)).slice(0, 12).forEach(m => { let d = document.createElement('div'); d.className = 'hit'; d.innerHTML = `<b>${m.name}</b><br><small>${m.minutes} Min. · ${m.ingredients.join(', ')}</small>`; d.onclick = () => { plan[i].menuId = m.id; savePlan(); renderCards(); renderFridge(); renderShopping() }; b.appendChild(d) }) }
        function renderFridge() { let s = dateAt(0), e = dateAt(13); $('weekTitle').textContent = `Wochenplan KW ${isoWeek(s)}`; $('weekDates').textContent = `${fmt(s)} - ${fmt(e)}`; let g = $('weekGrid'); g.innerHTML = ''; DAYS.forEach((day, i) => { let m = menuById(plan[i].menuId), d = document.createElement('article'); d.className = 'weekCard'; const visibleEvents = (plan[i].events || []).slice(0, 4); const moreCount = Math.max(0, (plan[i].events || []).length - 4); const eventsHtml = visibleEvents.map(e => `<div class="weekEvent">${TYPES[e.type] || '📅'} <span class="eventType">${e.type === 'Sonstiges' ? '' : e.type}</span> ${[e.title, e.time].filter(Boolean).join(' ')}</div>`).join('') + (moreCount ? `<div class="weekEvent">+${moreCount} weitere</div>` : ''); d.innerHTML = `<h3>${day}<br><small>${fmt(dateAt(i))}</small></h3><div class="weekEvents">${eventsHtml || '&nbsp;'}</div><div class="weekMeal">${m ? '🍽 ' + m.name : '&nbsp;'}</div>`; g.appendChild(d) }) }
        function renderMaster() { let q = $('masterSearch').value.toLowerCase(), f = $('masterFilter').value, l = $('masterList'); l.innerHTML = ''; master.filter(m => (!q || `${m.name} ${m.categories.join(' ')} ${m.ingredients.join(' ')}`.toLowerCase().includes(q)) && (!f || m.categories.includes(f))).forEach(m => { let d = document.createElement('div'); d.className = 'masterItem ' + (m.active === false ? 'off' : ''); d.innerHTML = `<b>${m.name}</b><div>${m.categories.join(', ')} · ${m.minutes} Min.</div><small>${m.ingredients.join(', ')}</small><div class="actions"><button>Bearbeiten</button><button>${m.active === false ? 'Aktivieren' : 'Deaktivieren'}</button><button>Löschen</button></div>`; let [ed, tog, del] = d.querySelectorAll('button'); ed.onclick = () => editMenu(m); tog.onclick = () => { m.active = m.active === false; set('fh84_master', master); renderAll() }; del.onclick = () => { if (confirm('Menü wirklich löschen?')) { master = master.filter(x => x.id !== m.id); set('fh84_master', master); renderAll() } }; l.appendChild(d) }) }
        function editMenu(m) { editingId = m.id; $('fName').value = m.name; $('fMinutes').value = m.minutes; $('fCategory').value = m.categories[0] || 'Schnell'; $('fIngredients').value = m.ingredients.join('\n'); $('fMode').value = m.modes[0] || 'Flexibel'; $('saveMenu').textContent = 'Änderungen speichern'; window.scrollTo({ top: 0, behavior: 'smooth' }) } function clearForm() { editingId = null;['fName', 'fMinutes', 'fIngredients'].forEach(id => $(id).value = ''); $('saveMenu').textContent = 'Neu speichern' } function saveMenu() { let name = $('fName').value.trim(); if (!name) return alert('Menüname fehlt'); let obj = { id: editingId || 'C' + Date.now(), name, categories: [$('fCategory').value], minutes: +$('fMinutes').value || 20, modes: [$('fMode').value, 'Flexibel'], ingredients: $('fIngredients').value.split(/\n|,|;/).map(x => x.trim()).filter(Boolean), active: true }; let ix = master.findIndex(m => m.id === editingId); if (ix >= 0) master[ix] = obj; else master.push(obj); set('fh84_master', master); clearForm(); renderAll() }
        function needed() { let a = []; DAYS.forEach((_, i) => menuById(plan[i].menuId)?.ingredients.forEach(x => a.push(x))); return [...new Set(a)].sort() } function renderShopping() { let have = $('bring').value.split(/\n|,|;/).map(x => x.trim().toLowerCase()).filter(Boolean); $('missing').innerHTML = needed().filter(x => !have.includes(x.toLowerCase())).map(x => `<li>${x}</li>`).join('') || '<li>Alles vorhanden</li>' } async function copyMissing() { renderShopping(); let t = [...$('missing').querySelectorAll('li')].map(x => x.textContent).join('\n'); try { await navigator.clipboard.writeText(t); alert('Kopiert') } catch { prompt('Kopieren', t) } } function download(name, o) { let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o, null, 2)], { type: 'application/json' })); a.download = name; a.click(); URL.revokeObjectURL(a.href) } function normalizeMaster(data) { let arr = Array.isArray(data) ? data : (data.menus || data.master || data.items); if (!Array.isArray(arr)) throw new Error('Keine Menüliste gefunden'); return arr.map((m, i) => ({ id: m.id || `M${String(i + 1).padStart(3, '0')}`, name: m.name || m.menu || `Menü ${i + 1}`, categories: m.categories || m.category || ['Sonstiges'], minutes: m.minutes ?? m.activeMinutes ?? 20, modes: m.modes || ['Flexibel'], ingredients: m.ingredients || [], active: m.active !== false })) }
        function readJson(e, cb) { let f = e.target.files[0]; if (!f) return; let r = new FileReader(); r.onload = () => { try { let txt = String(r.result).replace(/^\uFEFF/, '').trim(); let parsed = JSON.parse(txt); if (e.target.id === 'importMaster') parsed = normalizeMaster(parsed); cb(parsed); e.target.value = '' } catch (err) { alert('Import nicht möglich: ' + err.message) } }; r.readAsText(f) } init();
    </script>
